[project]
authors = [{name = "Antoine"}]
dependencies = ["pandaspgs>=1.0.0,<2"]
name = "pgscaler"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.hatch.build.targets.wheel]
packages = ["src/foo"] 


[tool.pixi.pypi-dependencies]
pgscaler = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
hydra-core = ">=1.3.7,<2"
omegaconf = ">=2.3.1,<3"
ruff = ">=0.17.5,<0.18"
rich = ">=15.0.0,<16"
seaborn = ">=0.13.2,<0.14"
plotly = ">=7.1.0,<8"
